<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${statusCode + ' · Anfrage nicht möglich'}">Fehler</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="error-page">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="error-card text-center">
        <div class="error-code" th:text="${statusCode}">400</div>
        <div class="broken-qr" aria-hidden="true">!</div>
        <h1 class="display-6 fw-bold">Das passt so noch nicht.</h1>
        <p class="lead text-body-secondary" th:text="${message}">Die Anfrage konnte nicht verarbeitet werden.</p>
        <a class="btn btn-primary btn-lg mt-3" th:href="@{/}">Zur Startseite</a>
    </section>
</main>
</body>
</html>
