<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navigation(activePage)" class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">▦</span>
            <span>Marc QR</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                aria-controls="mainNavigation" aria-expanded="false" aria-label="Navigation öffnen">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
            <ul class="navbar-nav ms-auto gap-lg-2 py-2 py-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'home'} ? ' active'" th:href="@{/}">Start</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'qr'} ? ' active'" th:href="@{/qr}">QR-Code</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'batch'} ? ' active'" th:href="@{/qr/batch}">QR-Stapel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'codes'} ? ' active'" th:href="@{/codes}">Code-Excel</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="container py-4 text-center text-body-secondary small">
    Gemacht für flinke Codes und entspannte Scanner.
</footer>
</body>
</html>
